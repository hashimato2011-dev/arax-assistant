<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دستیار فروش آراکس</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14171a"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14171a;--mut:#6b7280;--line:#e6e8eb;--bg:#f4f5f3;--g:#5fe39a;--gd:#0f9a56;--card:#fff}
*{box-sizing:border-box;margin:0}body{font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.8}
button,input,select,textarea{font:inherit;color:inherit}
.hd{background:var(--ink);color:#fff;padding:18px 20px;position:relative;overflow:hidden}
.hd:before{content:"";position:absolute;inset:0;opacity:.22;background:conic-gradient(from 90deg at 50% 50%,#c0392b 0 25%,#e0a82e 0 50%,#2e8b6a 0 75%,#4a6fa5 0) 0 0/46px 46px;-webkit-mask:linear-gradient(90deg,#000,transparent 70%);mask:linear-gradient(270deg,#000,transparent 70%)}
.hd>*{position:relative}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--g);display:grid;place-items:center;color:var(--ink)}
.hd small{display:block;font-weight:400;color:#c9ced4;font-size:12.5px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#chat{max-width:680px;margin:0 auto;padding:18px 14px 190px}
.m{max-width:86%;padding:10px 14px;border-radius:16px;margin:8px 0;width:fit-content;animation:in .25s}
.m.b{background:#fff;border:1px solid var(--line);border-top-right-radius:4px}
.m.u{background:var(--ink);color:#fff;margin-right:auto;margin-left:0;border-top-left-radius:4px}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
#dock{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px;display:flex;justify-content:center}
#dock>*{max-width:680px;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:8px;max-height:36vh;overflow:auto}
.chip,.btn{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:600}
.chip:hover,.chip.on{background:var(--ink);color:#fff}.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.btn{border-radius:12px;border-color:var(--line);background:#fff}.btn.p{background:var(--g);border-color:var(--g);color:var(--ink)}.btn.d{color:#b42318}
.row{display:flex;gap:8px}input,select,textarea{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.pf{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:14px;width:100%;max-width:560px}
.pf table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}.pf td,.pf th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}.pf input{padding:4px 8px;width:90px}
.mut{color:var(--mut);font-size:13px}
/* admin */
#app{max-width:1100px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}nav button{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.kp .card b{font-size:26px;display:block;line-height:1.3}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card h3{font-size:15px;margin-bottom:10px}
.dn{display:flex;gap:14px;align-items:center}.dn ul{list-style:none;padding:0;font-size:14px}.dn i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}
.br{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}.br div{background:#eef0ee;border-radius:6px;height:12px}.br u{display:block;height:100%;background:var(--gd);border-radius:6px}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:14px}.t th{background:#eceeeb;text-align:right;padding:9px}.t td{padding:8px 9px;border-top:1px solid var(--line)}
.wrap{overflow-x:auto}.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}.fm label{font-size:13px;color:var(--mut)}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:14px;z-index:9}.modal>div{background:#fff;border-radius:16px;padding:18px;max-width:600px;width:100%;max-height:90vh;overflow:auto}
@media print{body>*:not(.modal){display:none}.modal{position:static;background:none}.modal button{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="root"></div>
<script>
const K='arax_assist_v1',$=q=>document.querySelector(q);
const fa=n=>(+n||0).toLocaleString('fa-IR'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=(t,c,h)=>{const e=document.createElement(t);e.className=c||'';e.innerHTML=h||'';return e},sleep=ms=>new Promise(r=>setTimeout(r,ms));
const IC={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',box:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>',file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 0 1 0 6M22 20c0-3-2-5-4-5.5"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const DEF={products:[{c:'T-01',n:'کاشی بتنی رنگی ۴۰×۴۰ (نمونه)',cap:40,p:0,u:'متر مربع'},{c:'C-01',n:'جدول بتنی خیابانی (نمونه)',cap:30,p:0,u:'عدد'},{c:'B-01',n:'بلوک ساختمانی (نمونه)',cap:100,p:0,u:'عدد'}],leads:[],cat:'',
cfg:{o:'',sr:'',lr:'',t:'',ct:'',phone:'',intro:'مجموعه آراکس تولیدکننده کاشی بتنی رنگی در ابعاد مختلف، جدول بتنی خیابانی و بلوک ساختمانی است. وب‌سایت: www.arax.co.ir'}};
let DB;try{DB=JSON.parse(localStorage.getItem(K))}catch(e){}DB=Object.assign(JSON.parse(JSON.stringify(DEF)),DB||{});DB.cfg=Object.assign({},DEF.cfg,DB.cfg);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB));return 1}catch(e){alert('حافظه پر است؛ حجم کاتالوگ را کمتر کنید.')}};
const jd=t=>new Date(t).toLocaleDateString('fa-IR-u-ca-persian');
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const CUST=/[?&]c(=|&|$)/.test(location.search);
/* ---------- GitHub ---------- */
const GH='https://api.github.com/repos/';
async function ghPut(path,b){const c=DB.cfg,u=`${GH}${c.o}/${c.sr}/contents/${path}`,H={Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'};let sha;const r=await fetch(u,{headers:H});if(r.ok)sha=(await r.json()).sha;const w=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify({message:'update '+path,content:b,sha})});if(!w.ok)throw Error((await w.json()).message)}
async function publish(){const c=DB.cfg;if(!c.o||!c.sr||!c.t)return alert('مالک، مخزن سایت و توکن را در تنظیمات وارد کنید');
 try{await ghPut('data.json',b64(JSON.stringify({products:DB.products,cat:!!DB.cat,cfg:{o:c.o,lr:c.lr,ct:c.ct,phone:c.phone,intro:c.intro}})));
 if(DB.cat)await ghPut('catalog.pdf',DB.cat.split(',')[1]);alert('✅ منتشر شد. محصولات و کاتالوگ برای مشتری به‌روز شد.')}catch(e){alert('خطا: '+e.message)}}
async function sync(){const c=DB.cfg;if(!c.o||!c.lr||!c.t)return alert('مخزن پاسخ‌ها و توکن را در تنظیمات وارد کنید');let n=0;
 try{for(let p=1;p<=10;p++){const r=await fetch(`${GH}${c.o}/${c.lr}/issues?state=all&per_page=100&page=${p}`,{headers:{Authorization:'Bearer '+c.t}});if(!r.ok)throw Error((await r.json()).message);const a=await r.json();
 a.forEach(i=>{if(!/^AraxLead/.test(i.title))return;try{const l=JSON.parse(i.body.replace(/```json|```/g,''));if(!DB.leads.some(x=>x.id==l.id)){DB.leads.push(l);n++}}catch(e){}});if(a.length<100)break}
 save();alert(`${fa(n)} پاسخ جدید دریافت شد`);go(TAB)}catch(e){alert('خطا: '+e.message)}}
/* ---------- Customer chat ---------- */
async function startCustomer(preview){
 if(!preview){try{const d=await(await fetch('data.json?'+Date.now())).json();DB.products=d.products;DB.cfg=Object.assign(DB.cfg,d.cfg);DB.cat=d.cat?'catalog.pdf':''}catch(e){}}
 const c=DB.cfg;$('#root').innerHTML=`<div class="hd"><div class="brand"><div class="logo">${ic('chat')}</div><div>دستیار فروش آراکس<small>پاسخ سریع · معرفی محصولات · پیش‌فاکتور</small></div></div>${preview?'<button class="btn" style="margin-top:10px" onclick="location.reload()">بازگشت به پنل مدیریت</button>':''}</div><div id="chat"></div><div id="dock"></div>`;
 const chat=$('#chat'),dock=n=>$('#dock').replaceChildren(n),sc=()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
 const say=async h=>{chat.append(el('div','m b',h));sc();await sleep(380)},me=t=>{chat.append(el('div','m u',esc(t)));sc()};
 const pick=async(q,o)=>{await say(q);return new Promise(r=>{const d=el('div','opts');o.forEach((x,i)=>{const b=el('button','chip',esc(x));b.onclick=()=>{d.remove();me(x);r(i)};d.append(b)});dock(d)})};
 const multi=async(q,o)=>{await say(q);return new Promise(r=>{const d=el('div'),w=el('div','opts'),S=new Set();o.forEach((x,i)=>{const b=el('button','chip',esc(x));b.onclick=()=>{S.has(i)?S.delete(i):S.add(i);b.classList.toggle('on')};w.append(b)});const go=el('button','btn p','ادامه');go.style.marginTop='10px';go.onclick=()=>{const v=[...S].map(i=>o[i]);me(v.join('، ')||'—');r(v)};d.append(w,go);dock(d)})};
 const text=async(q,{ph='',num,skip}={})=>{await say(q);return new Promise(r=>{const d=el('div'),row=el('div','row'),i=el('input');i.placeholder=ph;if(num){i.inputMode='decimal'}const s=el('button','btn p',ic('send'));const ok=v=>{me(v||'—');r(v)};s.onclick=()=>{let v=i.value.trim().replace(/[۰-۹]/g,x=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(x)).replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x));if(num&&!(+v>0))return i.focus();if(!v&&!skip)return i.focus();ok(v)};i.onkeydown=e=>e.key=='Enter'&&s.click();row.append(i,s);d.append(row);if(skip){const k=el('button','chip','فعلاً نمی‌خواهم بگویم');k.style.marginTop='8px';k.onclick=()=>ok('');d.append(k)}dock(d);i.focus()})};
 const P=DB.products,A={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:Date.now(),items:[]};
 const addItem=async()=>{const i=await pick('کدام محصول را می‌خواهید؟',P.map(p=>p.n));const p=P[i];const q=+await text(`چه مقدار از «${p.n}» نیاز دارید؟ (${p.u})`,{ph:'مثلاً ۲۰۰',num:1});A.items.push({c:p.c,n:p.n,u:p.u,p:p.p,cap:p.cap,q})};
 await say('به صفحه دستیار فروش مجموعه آراکس خوش آمدید 👋');
 if(!P.length){await say('فعلاً محصولی ثبت نشده است.')}
 const know=await pick('آیا با مجموعه ما آشنایی دارید؟',['بله','خیر']);A.know=know?'خیر':'بله';
 if(!know){const b=await pick('آیا تاکنون محصولی از مجموعه ما تهیه کرده‌اید؟',['بله','خیر']);A.bought=b?'خیر':'بله';
  if(!b){A.used=await multi('محصول مورد نظر را انتخاب کنید (می‌توانید چند مورد انتخاب کنید)',P.map(p=>p.n));
   A.sat=['بسیار راضی','راضی','متوسط','ناراضی'][await pick('از کیفیت محصولات و پشتیبانی تیم فروش راضی هستید؟',['بسیار راضی','راضی','متوسط','ناراضی'])];
   A.missing=await text('جای چه محصول یا خدمتی در مجموعه ما خالی است؟',{ph:'نظر شما برای ما ارزشمند است',skip:1})}}
 else{await say(esc(c.intro));if(DB.cat||preview)await say(`📄 می‌توانید کاتالوگ ما را همین‌جا مشاهده بفرمایید:<br><a class="btn" style="display:inline-block;margin-top:6px;text-decoration:none" target="_blank" href="${preview?DB.cat:'catalog.pdf'}">مشاهده کاتالوگ</a>`)}
 const need=await pick('آیا محصولی در حال حاضر مورد نیاز شما می‌باشد؟',['بله','خیر']);A.need=need?'خیر':'بله';
 if(!need&&P.length)await addItem();
 A.name=await text('لطفاً نام و نام خانوادگی خود را بنویسید:',{ph:'نام شما'});A.phone=await text('شماره تماس شما:',{ph:'۰۹۱۲...'});
 if(A.items.length){const w=await pick('می‌خواهید یک پیش‌فاکتور برایتان آماده کنم تا مشاهده بفرمایید؟',['بله، تهیه پیش‌فاکتور','خیر']);
  if(!w){A.pf=1;await say('پیش‌فاکتور شما آماده است. برای ویرایش، مقدار را تغییر دهید یا محصول اضافه/حذف کنید:');await new Promise(r=>{const box=el('div','pf');chat.append(box);const draw=()=>{const tot=A.items.reduce((s,x)=>s+x.q*x.p,0);box.innerHTML=`<b>پیش‌فاکتور آراکس</b> <span class="mut">${jd(Date.now())} · شماره ${esc(A.id.slice(-5))}</span><div class="mut">مشتری: ${esc(A.name)} · ${esc(A.phone)}</div>
   <div class="wrap"><table><tr><th>کد</th><th>محصول</th><th>مقدار</th><th>پالت</th><th>مبلغ</th><th></th></tr>${A.items.map((x,i)=>`<tr><td>${esc(x.c)}</td><td>${esc(x.n)}</td><td><input data-i="${i}" value="${x.q}" inputmode="decimal"> ${esc(x.u)}</td><td>${fa(Math.ceil(x.q/(x.cap||1)))}</td><td>${x.p?fa(x.q*x.p):'—'}</td><td><button class="btn d" data-r="${i}">حذف</button></td></tr>`).join('')}</table></div>
   <b>جمع کل: ${tot?fa(tot)+' تومان':'طبق استعلام کارشناس'}</b><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn" id="ad">افزودن محصول</button><button class="btn p" id="ok">تأیید و ارسال به کارشناس فروش</button></div>`;
   box.querySelectorAll('input').forEach(i=>i.onchange=()=>{const v=+String(i.value).replace(/[۰-۹]/g,x=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(x));if(v>0)A.items[i.dataset.i].q=v;draw()});
   box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{A.items.splice(b.dataset.r,1);draw()});
   box.querySelector('#ad').onclick=async()=>{box.querySelectorAll('button').forEach(b=>b.disabled=1);await addItem();draw();sc()};box.querySelector('#ok').onclick=()=>{box.querySelectorAll('button,input').forEach(b=>b.disabled=1);r()}};draw()})}}
 dock(el('div','mut','در حال ثبت اطلاعات…'));
 let sent=0;if(!preview){A.src='online';try{if(c.ct&&c.lr){const r=await fetch(`${GH}${c.o}/${c.lr}/issues`,{method:'POST',headers:{Authorization:'Bearer '+c.ct},body:JSON.stringify({title:'AraxLead '+A.id,body:'```json\n'+JSON.stringify(A)+'\n```'})});sent=r.ok}}catch(e){}}else{A.src='test';DB.leads.push(A);save();sent=1}
 await say(sent?'✅ اطلاعات شما ثبت شد. <b>کارشناسان فروش در اسرع وقت با شما تماس می‌گیرند.</b> 🙏':'اطلاعات دریافت شد؛ اما ارسال با خطا مواجه شد. لطفاً با ما تماس بگیرید'+(c.phone?': '+esc(c.phone):'')+'.');
 dock(el('div','mut','سپاس از وقتی که گذاشتید.'))}
/* ---------- Admin ---------- */
let TAB='dash';const TABS=[['dash','chart','داشبورد'],['leads','users','پاسخ‌ها و پیش‌فاکتورها'],['prods','box','محصولات'],['cat','file','کاتالوگ'],['set','gear','تنظیمات و پشتیبان']];
const COL=['#0f9a56','#14171a','#5fe39a','#9aa3ad','#e0a82e'];
const cnt=(a,f)=>{const m={};a.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const donut=d=>{const T=d.reduce((a,b)=>a+b[1],0)||1,R=40,C=2*Math.PI*R;let o=0,s='';d.forEach((x,i)=>{const l=x[1]/T*C;s+=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${COL[i%5]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l});return d.length?`<div class="dn"><svg viewBox="0 0 120 120" width="120">${s}</svg><ul>${d.map((x,i)=>`<li><i style="background:${COL[i%5]}"></i>${esc(x[0])} <b>${fa(x[1])}</b></li>`).join('')}</ul></div>`:'<p class="mut">هنوز داده‌ای نیست</p>'};
const bars=d=>{const m=Math.max(1,...d.map(x=>x[1]));return d.length?d.slice(0,7).map(x=>`<div class="br"><span>${esc(x[0])}</span><div><u style="width:${x[1]/m*100}%"></u></div><b>${fa(x[1])}</b></div>`).join(''):'<p class="mut">هنوز داده‌ای نیست</p>'};
const trend=()=>{const D=14,day=864e5,now=new Date().setHours(0,0,0,0),v=Array.from({length:D},(_,i)=>DB.leads.filter(l=>l.t>=now-(D-1-i)*day&&l.t<now-(D-2-i)*day).length),m=Math.max(1,...v);const pts=v.map((y,i)=>`${10+i*(280/(D-1))},${90-y/m*75}`).join(' ');return `<svg viewBox="0 0 300 100" width="100%"><polyline points="${pts}" fill="none" stroke="#0f9a56" stroke-width="3" stroke-linejoin="round"/>${v.map((y,i)=>`<circle cx="${10+i*(280/(D-1))}" cy="${90-y/m*75}" r="3" fill="#14171a"/>`).join('')}</svg><p class="mut">مراجعه‌های ۱۴ روز اخیر (بیشترین: ${fa(m)})</p>`};
const total=l=>l.items.reduce((s,x)=>s+x.q*x.p,0);
const V={
dash(){const L=DB.leads,n=L.length,k=(a,b)=>`<div class="card"><span class="mut">${a}</span><b>${b}</b></div>`,it={};L.forEach(l=>l.items.forEach(x=>it[x.n]=(it[x.n]||0)+x.q));
 return `<div class="kp">${k('کل مراجعه‌ها',fa(n))}${k('آشنا با آراکس',fa(L.filter(l=>l.know=='بله').length))}${k('مشتری قبلی',fa(L.filter(l=>l.bought=='بله').length))}${k('درخواست خرید',fa(L.filter(l=>l.need=='بله').length))}${k('پیش‌فاکتور',fa(L.filter(l=>l.pf).length))}${k('جمع مبلغ پیش‌فاکتورها',fa(L.reduce((s,l)=>s+total(l),0)))}</div>
 <div class="gr"><div class="card"><h3>آشنایی با مجموعه</h3>${donut(cnt(L,l=>l.know))}</div><div class="card"><h3>سابقه خرید</h3>${donut(cnt(L,l=>l.bought))}</div><div class="card"><h3>رضایت مشتریان قبلی</h3>${bars(cnt(L,l=>l.sat))}</div>
 <div class="card"><h3>محصولات پرتقاضا (مجموع مقدار)</h3>${bars(Object.entries(it).sort((a,b)=>b[1]-a[1]))}</div><div class="card"><h3>روند مراجعه</h3>${trend()}</div>
 <div class="card"><h3>محصول/خدمت خالی از دید مشتریان</h3>${L.filter(l=>l.missing).slice(-8).reverse().map(l=>`<p>• ${esc(l.missing)}</p>`).join('')||'<p class="mut">هنوز نظری ثبت نشده</p>'}</div></div>`},
leads(){const L=[...DB.leads].sort((a,b)=>b.t-a.t);return `<div class="row" style="margin-bottom:10px"><button class="btn" onclick="sync()">دریافت پاسخ‌های جدید از GitHub</button><button class="btn" onclick="csv()">خروجی Excel (CSV)</button></div><div class="wrap"><table class="t"><tr><th>تاریخ</th><th>نام</th><th>تلفن</th><th>آشنا</th><th>رضایت</th><th>خرید</th><th>وضعیت</th><th></th></tr>${L.map(l=>`<tr><td>${jd(l.t)}</td><td>${esc(l.name)}</td><td>${esc(l.phone)}</td><td>${esc(l.know)}</td><td>${esc(l.sat||'—')}</td><td>${l.items.length?fa(total(l))||'استعلام':'—'}</td><td><select onchange="st('${l.id}',this.value)">${['جدید','تماس گرفته شد','تکمیل'].map(s=>`<option ${l.st==s||(!l.st&&s=='جدید')?'selected':''}>${s}</option>`).join('')}</select></td><td>${l.items.length?`<button class="btn" onclick="pv('${l.id}')">پیش‌فاکتور</button>`:''}<button class="btn d" onclick="dl('${l.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="8" class="mut">هنوز پاسخی ثبت نشده</td></tr>'}</table></div>`},
prods(){return `<div class="card"><h3>افزودن / ویرایش محصول</h3><div class="fm"><div><label>کد محصول</label><input id="pc"></div><div><label>نام محصول</label><input id="pn"></div><div><label>ظرفیت پالت</label><input id="pp" type="number"></div><div><label>قیمت (تومان)</label><input id="pr" type="number"></div><div><label>واحد</label><input id="pu" value="متر مربع"></div></div><button class="btn p" onclick="addP()">ذخیره محصول</button></div><br><div class="wrap"><table class="t"><tr><th>کد</th><th>نام</th><th>ظرفیت پالت</th><th>قیمت</th><th>واحد</th><th></th></tr>${DB.products.map((p,i)=>`<tr><td>${esc(p.c)}</td><td>${esc(p.n)}</td><td>${fa(p.cap)}</td><td>${fa(p.p)}</td><td>${esc(p.u)}</td><td><button class="btn" onclick="edP(${i})">ویرایش</button><button class="btn d" onclick="DB.products.splice(${i},1);save();go('prods')">حذف</button></td></tr>`).join('')}</table></div><p class="mut">پس از تغییر محصولات، در «تنظیمات» دکمه «انتشار» را بزنید تا لینک مشتری به‌روز شود.</p>`},
cat(){return `<div class="card"><h3>کاتالوگ PDF</h3><p class="mut">فایل PDF را بارگذاری کنید (حداکثر حدود ۳ مگابایت). مشتری آن را داخل گفتگو می‌بیند.</p><input type="file" accept="application/pdf" onchange="upCat(this.files[0])">${DB.cat?`<p>✅ کاتالوگ بارگذاری شده است. <a href="${DB.cat}" target="_blank">مشاهده</a> <button class="btn d" onclick="DB.cat='';save();go('cat')">حذف</button></p>`:''}</div>`},
set(){const c=DB.cfg,f=(k,l,t='text')=>`<div><label>${l}</label><input data-k="${k}" type="${t}" value="${esc(c[k])}"></div>`,link=c.o&&c.sr?`https://${c.o}.github.io/${c.sr}/?c=1`:'';
 return `<div class="card"><h3>اتصال به GitHub</h3><div class="fm">${f('o','نام کاربری GitHub')}${f('sr','مخزن سایت (عمومی، Pages)')}${f('lr','مخزن پاسخ‌ها (خصوصی)')}${f('t','توکن مدیر (Contents + Issues)','password')}${f('ct','توکن مشتری (فقط Issues مخزن پاسخ‌ها)','password')}${f('phone','تلفن شرکت')}</div><label>متن معرفی شرکت</label><textarea data-k="intro" rows="3">${esc(c.intro)}</textarea><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn p" onclick="saveSet()">ذخیره</button><button class="btn" onclick="saveSet();publish()">انتشار محصولات و کاتالوگ</button><button class="btn" onclick="sync()">دریافت پاسخ‌ها</button></div>
 ${link?`<p style="margin-top:10px">لینک مشتری: <b dir="ltr">${link}</b> <button class="btn" onclick="navigator.clipboard.writeText('${link}');alert('کپی شد')">کپی</button></p>`:''}</div><br>
 <div class="card"><h3>پشتیبان‌گیری</h3><div class="row" style="flex-wrap:wrap"><button class="btn" onclick="bk()">دانلود فایل پشتیبان</button><label class="btn">بازیابی فایل پشتیبان<input type="file" accept=".json" hidden onchange="rs(this.files[0])"></label><button class="btn" onclick="startCustomer(1)">پیش‌نمایش گفتگوی مشتری</button></div></div>`}};
function go(t){TAB=t;$('#root').innerHTML=`<div class="hd"><div class="brand"><div class="logo">${ic('chat')}</div><div>دستیار فروش آراکس<small>پنل مدیریت و تحلیل</small></div></div></div><div id="app"><nav>${TABS.map(x=>`<button class="${x[0]==t?'on':''}" onclick="go('${x[0]}')">${ic(x[1])}${x[2]}</button>`).join('')}</nav>${V[t]()}</div>`}
const saveSet=()=>{document.querySelectorAll('[data-k]').forEach(i=>DB.cfg[i.dataset.k]=i.value.trim());save();go('set')};
const st=(id,v)=>{DB.leads.find(l=>l.id==id).st=v;save()},dl=id=>{if(confirm('حذف شود؟')){DB.leads=DB.leads.filter(l=>l.id!=id);save();go('leads')}};
function addP(){const g=i=>$('#'+i).value.trim(),p={c:g('pc'),n:g('pn'),cap:+g('pp')||1,p:+g('pr')||0,u:g('pu')||'عدد'};if(!p.c||!p.n)return alert('کد و نام محصول را وارد کنید');const i=DB.products.findIndex(x=>x.c==p.c);i<0?DB.products.push(p):DB.products[i]=p;save();go('prods')}
function edP(i){go('prods');const p=DB.products[i];pc.value=p.c;pn.value=p.n;pp.value=p.cap;pr.value=p.p;pu.value=p.u;scrollTo(0,0)}
function upCat(f){if(!f)return;if(f.size>3e6)return alert('حجم فایل بیش از ۳ مگابایت است');const r=new FileReader();r.onload=()=>{DB.cat=r.result;save()&&go('cat')};r.readAsDataURL(f)}
function pv(id){const l=DB.leads.find(x=>x.id==id),m=el('div','modal');m.innerHTML=`<div><div class="pf" style="border:0;max-width:none"><h3>پیش‌فاکتور آراکس</h3><p>${jd(l.t)} · شماره ${esc(l.id.slice(-5))}<br>مشتری: ${esc(l.name)} · ${esc(l.phone)}</p><table><tr><th>کد</th><th>محصول</th><th>مقدار</th><th>پالت</th><th>مبلغ</th></tr>${l.items.map(x=>`<tr><td>${esc(x.c)}</td><td>${esc(x.n)}</td><td>${fa(x.q)} ${esc(x.u)}</td><td>${fa(Math.ceil(x.q/(x.cap||1)))}</td><td>${x.p?fa(x.q*x.p):'—'}</td></tr>`).join('')}</table><b>جمع: ${fa(total(l))} تومان</b></div><div class="row" style="margin-top:10px"><button class="btn p" onclick="print()">چاپ</button><button class="btn" onclick="this.closest('.modal').remove()">بستن</button></div></div>`;document.body.append(m)}
function dlf(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
const bk=()=>dlf('arax-assistant-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(DB),'application/json');
function rs(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products)throw 0;DB=Object.assign(JSON.parse(JSON.stringify(DEF)),d);save();go('set');alert('بازیابی شد')}catch(e){alert('فایل پشتیبان معتبر نیست')}};r.readAsText(f)}
function csv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',h=['تاریخ','نام','تلفن','آشنا','خرید قبلی','محصولات استفاده‌شده','رضایت','محصول/خدمت خالی','نیاز فعلی','اقلام','جمع'];dlf('arax-leads.csv','\ufeff'+[h,...DB.leads.map(l=>[jd(l.t),l.name,l.phone,l.know,l.bought,(l.used||[]).join('؛'),l.sat,l.missing,l.need,l.items.map(x=>x.n+' × '+x.q).join('؛'),total(l)])].map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
CUST?startCustomer():go('dash');
if(/^http/.test(location.protocol)&&navigator.serviceWorker)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
